<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Navalha – Caixa do Barbeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fira+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>

:root{
  --bg:#141312; --card:#1f1d1b; --card2:#2b2825; --line:#3b3733;
  --tx:#f2ece0; --mut:#bdb4a7; --red:#c8352e; --blue:#2f5d8a; --paper:#f2ece0; --ink:#1a1816;
  --ok:#3d8a35; --bad:#c8352e; --r:8px;
  --disp:Anton,Impact,"Arial Narrow",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font:500 16px/1.4 "Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,a{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,select{font:inherit;font-size:18px;color:var(--tx);background:var(--card2);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;width:100%}
input:focus,select:focus{outline:2px solid var(--tx);border-color:transparent}
label{display:block;font-size:16px;color:var(--mut);margin:14px 0 6px}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:.3px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.brand{font-family:var(--disp);font-size:28px;letter-spacing:1px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand small{display:block;font-size:15px;color:#e06a62;letter-spacing:1.5px;margin-top:3px}
.pole{height:7px;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--paper) 10px 20px,var(--blue) 20px 30px,var(--paper) 30px 40px)}
.datebtn{margin-left:auto;flex:none;line-height:1.15;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-weight:700;
  display:flex;align-items:center;gap:6px;font-size:15px;position:relative;margin-top:0;color:var(--tx)}
.datebtn.other{background:var(--paper);color:var(--ink)}
.datebtn small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.datebtn.other small{color:#7a3b2a}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;padding:0}
.gear{width:44px;height:44px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
main{flex:1;overflow-y:auto;padding:14px 14px 16px}
.view{display:none}.view.on{display:block}

.rent{background:var(--card);border-radius:var(--r);padding:11px 14px;margin-bottom:12px}
.rent .t{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--mut)}
.rent .t b{color:var(--tx)}
.bar{height:8px;background:var(--card2);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--tx);transition:width .4s}
.rent.done .bar i{background:#6fbf5f}
.rent.done .t b{color:#8fd27f}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.blk{--c:var(--red);background:var(--card);border-radius:var(--r);min-height:132px;padding:14px 14px 18px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
  box-shadow:inset 0 -7px 0 var(--c);transition:transform .08s,background .12s}
.blk:active{transform:scale(.97)}
.blk .ic svg{width:38px;height:38px;stroke-width:1.8}
.blk .nm{font-family:var(--disp);font-size:29px;line-height:1;letter-spacing:.5px;text-transform:uppercase}
.blk.sel{background:var(--c);box-shadow:none;color:#fff}
.blk .badge{position:absolute;top:10px;right:10px;background:var(--paper);color:var(--ink);font-family:var(--disp);
  border-radius:4px;min-width:34px;height:34px;display:grid;place-items:center;font-size:20px;padding:0 8px}
.today{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:var(--r);padding:14px;margin-top:12px}
.today small{color:var(--mut);display:block;font-size:15px}
.today b{font-family:var(--disp);font-size:28px;font-weight:400;letter-spacing:.3px}
.btn{background:var(--card2);border-radius:var(--r);padding:14px 16px;font-weight:700;font-size:16px}
.btn.acc{background:var(--paper);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.full{width:100%;display:block;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid #7a2a26;color:#f08a83}

.cart{background:#0d0c0b;border-top:1px solid var(--line);padding:12px 14px;display:none}
.cart.on{display:block;animation:up .18s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--c,#555);color:#fff;border-radius:4px;padding:8px 10px 8px 12px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.chip svg{width:16px;height:16px;opacity:.85}
.totrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.totrow .lb{color:var(--mut);font-size:17px}
.totrow .vl{font-family:var(--disp);font-size:36px;letter-spacing:.5px;line-height:1}
.totrow .clr{color:var(--mut);font-size:15px;text-decoration:underline;margin-left:8px}
.pays{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pay{border-radius:var(--r);padding:12px 2px 11px;font-weight:700;font-size:15px;color:#fff;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.3px}
.pay svg{width:28px;height:28px}
.pay[data-p=pix]{background:#1f8a7e}.pay[data-p=dinheiro]{background:#3d7a35}
.pay[data-p=debito]{background:#2f5d8a}.pay[data-p=credito]{background:#b8592a}

nav{display:grid;grid-template-columns:repeat(3,1fr);background:#0d0c0b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:10px 0 12px;font-size:14px;color:var(--mut);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button.on{color:var(--tx)}
nav button.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--red)}

.back{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:20}
.back.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);
  border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));z-index:21;
  transform:translateY(105%);transition:transform .2s ease;max-height:92vh;overflow-y:auto}
.sheet.on{transform:none}
.sheet h3{margin:0 0 14px;font-family:var(--disp);font-weight:400;font-size:30px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sheet h3 svg{width:30px;height:30px}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.val{background:var(--card2);border-radius:var(--r);padding:20px 0;font-family:var(--disp);font-size:36px;letter-spacing:.5px}
.val:active{background:var(--paper);color:var(--ink)}
.val.other{font-family:inherit;font-size:18px;font-weight:700;grid-column:1/-1;padding:16px 0;background:transparent;border:1px dashed var(--mut)}

.pixscr{position:fixed;inset:0;background:var(--paper);color:var(--ink);z-index:40;display:none;flex-direction:column;
  align-items:center;padding:calc(20px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));text-align:center}
.pixscr.on{display:flex}
.pixscr .lbl{font-size:17px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#5a534a}
.pixscr .amt{font-family:var(--disp);font-size:58px;line-height:1.1;margin:2px 0 8px}
.pixscr .qr{width:min(84vw,380px);aspect-ratio:1;margin:6px auto;background:#fff;padding:6px;border-radius:6px}
.pixscr .qr svg{width:100%;height:100%;display:block}
.pixscr .who{color:#4a443c;font-size:16px;margin-bottom:auto;margin-top:6px}
.pixscr .acts{display:grid;grid-template-columns:1fr 2fr;gap:10px;width:100%;max-width:420px;margin-top:14px}
.pixscr .btn.ghost{color:var(--ink);border-color:#b9b0a3}

.flash{position:fixed;inset:0;display:grid;place-items:center;z-index:45;pointer-events:none;opacity:0;transition:opacity .15s}
.flash.on{opacity:1}
.flash div{background:var(--ok);color:#fff;border-radius:12px;padding:26px 36px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.55);transform:scale(.85);transition:transform .2s}
.flash.on div{transform:none}
.flash svg{width:86px;height:86px;stroke-width:3}
.flash span{display:block;font-family:var(--disp);font-size:34px;letter-spacing:.5px;margin-top:4px}
.flash small{display:block;font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:1px}

.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);
  background:var(--paper);color:var(--ink);border-radius:var(--r);padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;
  font-weight:700;z-index:50;opacity:0;pointer-events:none;transition:.2s;width:max-content;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:var(--ink);color:var(--paper);border-radius:6px;padding:9px 12px;font-weight:700}

.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.seg button{flex:1;padding:11px 4px;font-weight:700;font-size:15px;color:var(--mut);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--paper);color:var(--ink)}
.navp{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px;gap:8px}
.navp button{width:46px;height:46px;border-radius:var(--r);background:var(--card);display:grid;place-items:center}
.navp .lb{font-family:var(--disp);font-size:24px;letter-spacing:.5px;text-transform:uppercase;text-align:center;flex:1;line-height:1.1}
.navp .lb small{display:block;color:var(--mut);font-family:"Fira Sans",system-ui,sans-serif;font-weight:600;font-size:15px;text-transform:none;letter-spacing:0}
.range{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.range input{padding:10px;font-size:16px}

/* recibo */
.slip{background:var(--paper);color:var(--ink);border-radius:4px;padding:16px 16px 12px;position:relative;
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,#0000 98%,#000) 0 0/16px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,#0000 98%,#000) 0 0/16px 100% repeat-x;padding-bottom:20px}
.slip .ln{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px dashed #a69d90}
.slip .ln span{font-weight:700;font-size:18px}
.slip .ln span small{display:block;font-weight:500;font-size:14px;color:#5a534a}
.slip .ln b{font-family:var(--disp);font-weight:400;font-size:30px;letter-spacing:.3px;white-space:nowrap}
.slip .in b{color:#2f6b2a}.slip .out b{color:#a8281f}
.slip .sob{border-bottom:0;padding-top:12px}
.slip .sob span{font-size:20px;text-transform:uppercase;letter-spacing:.5px}
.slip .sob b{font-size:40px}
.slip .sob.neg b{color:#a8281f}
.slip .mini{display:flex;gap:18px;font-size:15px;color:#4a443c;padding-top:4px}
.slip .mini b{color:var(--ink);font-weight:700}

.sec{background:var(--card);border-radius:var(--r);padding:14px;margin-top:10px}
.sec h4{margin:0 0 10px;font-size:17px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:16px}
.row .n{width:104px;flex:none}
.row .b{flex:1;height:12px;background:var(--card2);border-radius:2px;overflow:hidden}
.row .b i{display:block;height:100%;background:var(--tx)}
.row .v{width:104px;text-align:right;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cols i{display:block;width:100%;background:#6d665d;min-height:2px}
.cols span{font-size:12px;color:var(--mut)}
.cols div.best i{background:var(--tx)}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.list .it:last-child{border:0}
.list .it .h{color:var(--mut);width:48px;flex:none}
.list .it .d{flex:1;min-width:0}
.list .it .d small{display:block;color:var(--mut);font-size:14px}
.list .it .m{font-weight:700}
.list .it .x{color:#f08a83;padding:6px}
.list .it .x svg{width:20px;height:20px}
.cmp{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.cmp th{font-size:14px;color:var(--mut);text-align:right;padding:6px 4px;font-weight:700}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-weight:700}
.up{color:#8fd27f}.dn{color:#f08a83}
.empty{color:var(--mut);text-align:center;padding:16px 0}
.mt{margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--mut);font-size:15px;margin-top:6px}
.ttl{font-family:var(--disp);font-weight:400;font-size:22px;letter-spacing:.5px;text-transform:uppercase;margin:20px 0 10px}
.gblk{min-height:104px}
.cfgsv{background:var(--card2);border-radius:var(--r);padding:12px;margin-bottom:10px}
.cfgsv .top{display:flex;gap:8px}
.cfgsv .top input{flex:1}
.cfgsv .top button{width:50px;color:#f08a83;display:grid;place-items:center}
.welcome{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;display:none;padding:0 0 30px}
.welcome.on{display:block}
.welcome .in{max-width:480px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 20px 0}
.welcome h1{font-family:var(--disp);font-weight:400;font-size:44px;letter-spacing:1px;line-height:1;margin:6px 0 10px;text-transform:uppercase}
.devbox{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:16px;text-align:center;margin:18px 0 10px}
.devbox small{display:block;font-size:15px;font-weight:700;color:#5a534a}
.devbox b{display:block;font-family:var(--disp);font-weight:400;font-size:48px;letter-spacing:4px;line-height:1.15}
.licwarn{background:#4a2a12;color:#ffd9b0;border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-weight:600;display:none}
.welcome p{color:var(--mut);margin:0 0 6px;font-size:17px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" id="brand">NAVALHA</div>
    <label class="datebtn" id="dateBtn"><i data-ic="cal"></i><span id="dateLbl"></span><input type="date" id="dateIn"></label>
    <button class="gear" id="gearBtn" aria-label="Ajustes"><i data-ic="ajuste"></i></button>
  </header>
  <div class="pole"></div>

  <main>
    <!-- LANÇAR -->
    <section class="view on" id="v-lancar">
      <div class="licwarn" id="licWarn"></div>
      <div class="rent" id="rentBox"></div>
      <div class="grid" id="servGrid"></div>
      <div class="today" id="todayBox"></div>
    </section>

    <!-- RELATÓRIOS -->
    <section class="view" id="v-rel">
      <div class="seg" id="relSeg"></div>
      <div id="relA"></div>
      <div id="relBody"></div>
    </section>

    <!-- GASTOS -->
    <section class="view" id="v-gastos">
      <div class="sec" style="margin-top:0">
        <h4>Sua parte do aluguel (por mês)</h4>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <b class="disp" style="font-size:34px" id="aluguelVal"></b>
          <button class="btn" id="aluguelEdit">Alterar</button>
        </div>
        <div class="hint">Lançado uma vez. Vale todo mês automaticamente.</div>
      </div>
      <div class="ttl">Lançar gasto</div>
      <div class="grid" id="gastoGrid"></div>
      <div class="sec">
        <h4 id="gastoListTit">Gastos do mês</h4>
        <div class="list" id="gastoList"></div>
      </div>
    </section>
  </main>

  <div class="cart" id="cart">
    <div class="chips" id="chips"></div>
    <div class="totrow"><span><span class="lb" style="font-size:17px">Total </span><button class="clr" id="clrCart">limpar</button></span><span class="vl" id="cartTot"></span></div>
    <div class="pays">
      <button class="pay" data-p="pix"><i data-ic="pix"></i>Pix</button>
      <button class="pay" data-p="dinheiro"><i data-ic="dinheiro"></i>Dinheiro</button>
      <button class="pay" data-p="debito"><i data-ic="debito"></i>Débito</button>
      <button class="pay" data-p="credito"><i data-ic="credito"></i>Crédito</button>
    </div>
  </div>

  <nav>
    <button class="on" data-v="lancar"><i data-ic="lancar"></i>Lançar</button>
    <button data-v="rel"><i data-ic="relatorio"></i>Relatórios</button>
    <button data-v="gastos"><i data-ic="gastos"></i>Gastos</button>
  </nav>
</div>

<div class="back" id="back"></div>
<div class="sheet" id="sheet"></div>

<div class="pixscr" id="pixScr">
  <div class="lbl">PAGUE COM PIX</div>
  <div class="amt" id="pixAmt"></div>
  <div class="qr" id="pixQr"></div>
  <div class="who" id="pixWho"></div>
  <div class="acts">
    <button class="btn ghost" id="pixBack">Voltar</button>
    <button class="btn ok" id="pixOk" style="font-size:19px">✓ Recebido</button>
  </div>
</div>

<div class="flash" id="flash"><div><i data-ic="check"></i><span id="flashV"></span><small id="flashP"></small></div></div>
<div class="toast" id="toast"><span id="toastTx"></span><button id="toastBt">Desfazer</button></div>
<div class="welcome" id="welcome"></div>
<div class="welcome" id="lock" style="z-index:70"></div>

<script>
/* ================= QR CODE (byte mode, correção M) ================= */
const QR=(()=>{
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const dcw=v=>Math.floor(raw(v)/8)-ECC[v]*BLK[v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const rsDiv=d=>{const r=Array(d-1).fill(0);r.push(1);let root=1;for(let i=0;i<d;i++){for(let j=0;j<r.length;j++){r[j]=mul(r[j],root);if(j+1<r.length)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rsRem=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r};
  const MASK=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,
    (x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(text));
    let v=1;for(;v<=40;v++){if(4+(v<=9?8:16)+bytes.length*8<=dcw(v)*8)break}

/* ================= PIX (BR Code estático) ================= */
const Pix=(()=>{
  const clean=(s,max)=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim().slice(0,max);
  const f=(id,val)=>id+String(val.length).padStart(2,'0')+val;
  function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}
    return c.toString(16).toUpperCase().padStart(4,'0')}
  function chave(tipo,k){k=(k||'').trim();
    if(tipo==='cpf')return k.replace(/\D/g,'');
    if(tipo==='cel'){let d=k.replace(/\D/g,'');if(!(d.startsWith('55')&&d.length>=12))d='55'+d;return '+'+d}
    if(tipo==='email')return k.toLowerCase();
    return k.toLowerCase();}
  function payload({tipo,chave:k,nome,cidade},valor){
    const mai=f('00','br.gov.bcb.pix')+f('01',chave(tipo,k));
    let p=f('00','01')+f('26',mai)+f('52','0000')+f('53','986');
    if(valor>0)p+=f('54',valor.toFixed(2));
    p+=f('58','BR')+f('59',clean(nome||'RECEBEDOR',25)||'RECEBEDOR')+f('60',clean(cidade||'BRASIL',15)||'BRASIL')+f('62',f('05','***'))+'6304';
    return p+crc16(p)}
  return {payload,crc16,chave};
})();

const LIC=(()=>{
  const A='23456789ABCDEFGHJKLMNPQRSTUVWXYZ',NOEXP=32767,EPOCH=Date.UTC(2026,0,1);

function fechamento(d){const s=stats(d,d),ym=d.slice(0,7),y=+ym.slice(0,4),m=+ym.slice(5)-1,
  sm=stats(ym+'-01',d),alu=aluguelMes(ym);
  let t=`*Fechamento${DB.cfg.apelido?' – '+DB.cfg.apelido:''}*\n${WD[P(d).getDay()]}, ${dmy(d)}\n\nClientes: ${s.n}\n*Entrou hoje: ${brl(s.fat)}*\n`;
  Object.keys(PAG).forEach(k=>{if(s.pag[k])t+=`• ${PAG[k]}: ${brl(s.pag[k])}\n`});
  const sv=Object.entries(s.serv);if(sv.length)t+=`\nServiços: ${sv.map(([n,o])=>`${n} ${o.q}x`).join(', ')}\n`;
  if(s.cons)t+=`Gastos do dia: ${brl(s.cons)}\n`;
  t+=`\nEntrou no mês até ${dm(d)}: ${brl(sm.fat)}`;
  if(alu>0){const liq=sm.fat-sm.cons;t+=liq>=alu?`\nAluguel pago ✓ Sobrou: ${brl(liq-alu)}`:`\nAluguel: ${Math.round(liq/alu*100)}% coberto (faltam ${brl(alu-liq)})`}
  sheet(`<h3>Fechamento do dia</h3><div class="sec" style="margin:0;white-space:pre-wrap;font-size:15px;line-height:1.5">${esc(t).replace(/\*/g,'')}</div>
    <a class="btn acc full mt" id="shWa" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">Enviar no WhatsApp</a><button class="btn full mt" id="shCp">Copiar texto</button>`);
  $('#shWa').href='https://wa.me/?text='+encodeURIComponent(t);
  $('#shCp').onclick=async()=>{try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){toast('Não foi possível copiar')}};
}

/* ================= RELATÓRIOS ================= */
const R={tipo:'dia',off:0,ini:null,fim:null,cmp:false,offB:-1,iniB:null,fimB:null};
const TIPOS=[['dia','Dia'],['semana','Semana'],['mes','Mês'],['ano','Ano'],['per','Datas']];
function rango(tipo,off,base){const d=P(base);
  if(tipo==='dia'){const s=addD(base,off);return [s,s,WD[P(s).getDay()],dmy(s)]}
  if(tipo==='semana'){const ini=addD(base,-d.getDay()+off*7),fim=addD(ini,6);return [ini,fim,'Semana',dm(ini)+' a '+dm(fim)]}
  if(tipo==='mes'){const x=new Date(d.getFullYear(),d.getMonth()+off,1),y=x.getFullYear(),m=x.getMonth();
    return [iso(x),`${y}-${pad(m+1)}-${pad(dim(y,m))}`,MES[m],String(y)]}
  if(tipo==='ano'){const y=d.getFullYear()+off;return [y+'-01-01',y+'-12-31','Ano',String(y)]}
}
function renderRel(){
  $('#relSeg').innerHTML=TIPOS.map(([k,l])=>`<button data-t="${k}" class="${R.tipo===k?'on':''}">${l}</button>`).join('');
  $('#relSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{R.tipo=b.dataset.t;R.off=0;R.offB=-1;renderRel()});
  let a,b,l1,l2;
  if(R.tipo==='per'){if(!R.ini){R.fim=curDate;R.ini=curDate.slice(0,8)+'01'}a=R.ini;b=R.fim;
    $('#relA').innerHTML=`<div class="range"><div><label style="margin-top:0">De</label><input type="date" id="pIni" value="${a}"></div><div><label style="margin-top:0">Até</label><input type="date" id="pFim" value="${b}"></div></div>`;
    $('#pIni').onchange=e=>{R.ini=e.target.value;if(R.ini>R.fim)R.fim=R.ini;renderRel()};$('#pFim').onchange=e=>{R.fim=e.target.value;if(R.fim<R.ini)R.ini=R.fim;renderRel()};
  }else{[a,b,l1,l2]=rango(R.tipo,R.off,curDate);
    $('#relA').innerHTML=`<div class="navp"><button id="pPrev" aria-label="Anterior">${I('esq')}</button><div class="lb">${l1}<small>${l2}</small></div><button id="pNext" aria-label="Próximo">${I('dir')}</button></div>`;
    $('#pPrev').onclick=()=>{R.off--;renderRel()};$('#pNext').onclick=()=>{R.off++;renderRel()}}
  const s=stats(a,b);let h='';
  const parteAlu=s.alu&&R.tipo!=='mes'&&R.tipo!=='ano'?'aluguel destes dias':'aluguel';
  h+=`<div class="slip"><div class="ln in"><span>Entrou</span><b>${brl(s.fat)}</b></div>
    <div class="ln out"><span>Saiu<small>gastos ${brl(s.cons)}${s.alu?' + '+parteAlu+' '+brl(s.alu):''}</small></span><b>− ${brl(s.cons+s.alu)}</b></div>
    <div class="ln sob ${s.luc<0?'neg':''}"><span>Sobrou</span><b>${brl(s.luc)}</b></div>
    <div class="mini"><span>Clientes: <b>${s.n}</b></span><span>Média por cliente: <b>${brl(s.tk)}</b></span></div></div>`;
  // comparar
  h+=`<button class="btn ${R.cmp?'acc':'ghost'} full mt" id="cmpBt">${R.cmp?'Fechar comparação':'Comparar com outro '+({dia:'dia',semana:'semana',mes:'mês',ano:'ano',per:'período de datas'})[R.tipo]}</button>`;
  if(R.cmp)h+=cmpHtml(s);
  // por pagamento
  const mx=Math.max(1,...Object.values(s.pag));
  h+=`<div class="sec"><h4>Como pagaram</h4>${Object.keys(PAG).map(k=>`<div class="row"><span class="n">${PAG[k]}</span><span class="b"><i style="width:${s.pag[k]/mx*100}%;background:${PCOL[k]}"></i></span><span class="v">${brl(s.pag[k])}</span></div>`).join('')}</div>`;
  // por serviço
  const sv=Object.entries(s.serv).sort((x,y)=>y[1].v-x[1].v),mv=Math.max(1,...sv.map(x=>x[1].v));
  h+=`<div class="sec"><h4>Serviços feitos</h4>${sv.length?sv.map(([n,o])=>`<div class="row"><span class="n">${esc(n)} <small style="color:var(--mut)">${o.q}x</small></span><span class="b"><i style="width:${o.v/mv*100}%;background:${corServ(n)}"></i></span><span class="v">${brl(o.v)}</span></div>`).join(''):'<div class="empty">Nenhum atendimento</div>'}</div>`;
  // gráfico
  if(R.tipo!=='dia'){let cols=[];
    if(R.tipo==='ano'){const y=a.slice(0,4);for(let m=0;m<12;m++){const k=y+'-'+pad(m+1);cols.push([MES[m].slice(0,3),Object.entries(s.dia).filter(([d])=>d.startsWith(k)).reduce((t,[,v])=>t+v,0)])}}
    else{let n=0;for(let d=a;d<=b&&n<62;d=addD(d,1),n++)cols.push([R.tipo==='semana'?WDs[P(d).getDay()]:String(P(d).getDate()),s.dia[d]||0])}
    const cm=Math.max(1,...cols.map(c=>c[1])),bi=cols.findIndex(c=>c[1]===cm&&cm>1),thin=cols.length>16;
    h+=`<div class="sec"><h4>${R.tipo==='ano'?'Quanto entrou por mês':'Quanto entrou por dia'}${bi>=0?` · melhor: ${cols[bi][0]}${R.tipo==='semana'||R.tipo==='ano'?'':''} (${brl(cm)})`:''}</h4><div class="cols">${cols.map((c,i)=>`<div class="${i===bi?'best':''}"><i style="height:${c[1]/cm*100}%"></i><span>${thin&&i%3?'':c[0]}</span></div>`).join('')}</div></div>`;
    if(R.tipo!=='semana'&&R.tipo!=='ano'){}
    // média por dia da semana
    if(R.tipo!=='semana'){const w=[0,0,0,0,0,0,0],c=[0,0,0,0,0,0,0];Object.entries(s.dia).forEach(([d,v])=>{const k=P(d).getDay();w[k]+=v;c[k]++});
      const av=w.map((v,i)=>c[i]?v/c[i]:0),am=Math.max(1,...av);
      if(Object.keys(s.dia).length>2)h+=`<div class="sec"><h4>Média por dia da semana</h4>${av.map((v,i)=>`<div class="row"><span class="n">${WD[i]}</span><span class="b"><i style="width:${v/am*100}%"></i></span><span class="v">${brl(v)}</span></div>`).join('')}</div>`}
  }
  // lista
  if(R.tipo==='dia'){h+=`<div class="sec"><h4>Atendimentos</h4><div class="list">${s.at.length?s.at.slice().reverse().map(x=>`<div class="it"><span class="h">${x.h}</span><span class="d">${x.it.map(i=>esc(i.s)).join(' + ')}<small>${PAG[x.p]}</small></span><span class="m">${brl(x.t)}</span><button class="x" data-id="${x.id}" aria-label="Apagar">${I('lixo')}</button></div>`).join(''):'<div class="empty">Nenhum atendimento neste dia</div>'}</div></div>
    <button class="btn acc full mt" onclick="fechamento('${a}')">Fechamento deste dia (WhatsApp)</button>`}
  $('#relBody').innerHTML=h;
  $('#cmpBt').onclick=()=>{R.cmp=!R.cmp;renderRel()};
  $('#relBody').querySelectorAll('.list .x').forEach(bt=>bt.onclick=()=>confirmar('Apagar este atendimento?',()=>{DB.atend=DB.atend.filter(x=>x.id!==bt.dataset.id);save();renderAll()}));
  bindCmp();
}
function cmpHtml(sA){let a,b,l1,l2,nav;
  if(R.tipo==='per'){if(!R.iniB){const len=(P(R.fim)-P(R.ini))/864e5;R.fimB=addD(R.ini,-1);R.iniB=addD(R.fimB,-Math.round(len))}a=R.iniB;b=R.fimB;
    nav=`<div class="range mt"><div><label style="margin-top:0">Comparar de</label><input type="date" id="bIni" value="${a}"></div><div><label style="margin-top:0">até</label><input type="date" id="bFim" value="${b}"></div></div>`}
  else{const off=R.off+R.offB;[a,b,l1,l2]=rango(R.tipo,off,curDate);
    nav=`<div class="navp mt"><button id="bPrev" aria-label="Anterior">${I('esq')}</button><div class="lb"><span style="color:var(--mut);font-size:15px">comparando com</span><br>${l1}<small>${l2}</small></div><button id="bNext" aria-label="Próximo">${I('dir')}</button></div>`}
  const sB=stats(a,b),rows=[['Entrou','fat',1],['Clientes','n',0],['Média/cliente','tk',1],['Saiu','g',1],['Sobrou','luc',1]];
  sA.g=sA.cons+sA.alu;sB.g=sB.cons+sB.alu;
  const lbf=r=>R.tipo==='dia'||R.tipo==='semana'?dm(r[0]):R.tipo==='mes'?r[2].slice(0,3)+'/'+r[3].slice(2):r[3];
  const lab=R.tipo==='per'?['Período 1','Período 2']:[lbf(rango(R.tipo,R.off,curDate)),lbf([a,b,l1,l2])];
  return nav+`<div class="sec"><table class="cmp"><tr><th></th><th>${lab[0]}</th><th>${lab[1]}</th><th>Dif.</th></tr>${rows.map(([n,k,m])=>{const x=sA[k],y=sB[k],d=y?Math.round((x-y)/Math.abs(y)*100):null,good=k==='g'?x<=y:x>=y;
    return `<tr><td>${n}</td><td>${m?brl(x):x}</td><td>${m?brl(y):y}</td><td class="${d===null||d===0?'':good?'up':'dn'}">${d===null?'–':(d>0?'+':'')+d+'%'}</td></tr>`}).join('')}</table></div>`}
function bindCmp(){const p=$('#bPrev');if(p){p.onclick=()=>{R.offB--;renderRel()};$('#bNext').onclick=()=>{R.offB++;renderRel()}}
  const i=$('#bIni');if(i){i.onchange=e=>{R.iniB=e.target.value;renderRel()};$('#bFim').onchange=e=>{R.fimB=e.target.value;renderRel()}}}

  const sv=c.serv.map(s=>({...s,v:s.v.slice()}));
  const draw=()=>{$('#svList').innerHTML=sv.map((s,i)=>`<div class="cfgsv"><div class="top"><input value="${esc(s.n)}" data-i="${i}" data-k="n" placeholder="Nome do serviço"><button data-del="${i}" aria-label="Apagar">${I('lixo')}</button></div><input class="mt" value="${s.v.join(', ')}" data-i="${i}" data-k="v" inputmode="decimal" placeholder="30, 35, 40"></div>`).join('');
    $('#svList').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const s=sv[+inp.dataset.i];if(inp.dataset.k==='n')s.n=inp.value;else s.vtxt=inp.value});
    $('#svList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{sv.splice(+b.dataset.del,1);draw()})};
  draw();
  $('#svAdd').onclick=()=>{sv.push({n:'',ic:'tesoura',v:[]});draw()};
  $('#svSave').onclick=()=>{const out=[];for(const s of sv){const v=s.vtxt!==undefined?s.vtxt.split(/[;,\s]+/).map(x=>num(x)).filter(x=>x>0):s.v;if(s.n.trim()&&v.length)out.push({n:s.n.trim(),ic:s.ic,v})}
    if(!out.length){toast('Cadastre pelo menos um serviço');return}DB.cfg.serv=out;save();renderAll();toast('Serviços salvos')};
  $('#cSavePix').onclick=()=>{Object.assign(DB.cfg,readPix());save();renderAll();toast('Dados salvos')};
  $('#cTest').onclick=()=>{const t=readPix();if(!t.chave){toast('Preencha a chave');return}closeSheet();
    $('#pixAmt').textContent=brl(1);$('#pixQr').innerHTML=QR.svg(Pix.payload(t,1));$('#pixWho').textContent='TESTE — pague R$ 1,00 com outro celular para conferir';
    $('#pixScr').classList.add('on');$('#pixOk').onclick=()=>$('#pixScr').classList.remove('on')};
  $('#bkExp').onclick=backup;
  $('#bkImp').onclick=()=>$('#bkFile').click();
  $('#bkFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cfg||!d.atend)throw 0;
    DB=d;save();closeSheet();renderAll();toast('Cópia recuperada')}catch(err){toast('Arquivo inválido')}};r.readAsText(f)};
  $('#wipe').onclick=()=>confirmar('Apagar TODOS os lançamentos e configurações?',()=>{DB=JSON.parse(JSON.stringify(DEF));save();renderAll();showWelcome()});
}
$('#gearBtn').onclick=openConfig;
async function backup(){const txt=JSON.stringify(DB),name='navalha-backup-'+todayIso()+'.json';
  try{const file=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Cópia dos dados – Navalha'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();toast('Cópia guardada')}

/* ================= PRIMEIRO ACESSO ================= */
function showWelcome(){const w=$('#welcome');w.classList.add('on');
  w.innerHTML=`<div class="pole"></div><div class="in"><h1>Navalha</h1><p>Seu caixa no bolso. Preencha seus dados uma vez só. Dá para mudar depois no botão de ajustes, no canto de cima.</p>
  ${pixFields(DB.cfg)}
  <label>Sua parte do aluguel por mês (opcional)</label><input id="wAlu" inputmode="decimal" placeholder="Ex.: 600">
  <button class="btn acc full" id="wGo" style="margin-top:22px;padding:18px;font-size:18px">Começar</button>
  <button class="btn full mt" id="wSkip" style="background:none;color:var(--mut)">Pular por enquanto</button></div>`;
  const fin=()=>{DB.cfg.ok=true;save();w.classList.remove('on');renderAll()};
  $('#wGo').onclick=()=>{Object.assign(DB.cfg,readPix());const v=num($('#wAlu').value);if(v>0){DB.cfg.aluguel=[{desde:todayIso().slice(0,7),valor:v}]}fin()};
  $('#wSkip').onclick=fin}

/* ================= NAVEGAÇÃO ================= */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+view));
  $('#toast').classList.remove('on');if(view==='rel'){R.off=0;R.cmp=false}renderAll();$('main').scrollTop=0});
function renderBrand(){const a=(DB.cfg.apelido||'').trim();$('#brand').innerHTML='NAVALHA'+(a?`<small>${esc(a.toUpperCase())}</small>`:'')}
function renderLicWarn(){const r=licInfo(),el=$('#licWarn');
  if(r.ok&&!r.sem&&r.left<=5&&r.left>=0){el.style.display='block';el.textContent=r.left===0?'Seu período de teste termina hoje.':`Seu período de teste termina em ${r.left} dia${r.left>1?'s':''}.`}else el.style.display='none'}
function renderAll(){renderBrand();renderLicWarn();renderLancar();if(view==='rel')renderRel();if(view==='gastos')renderGastos();renderCart()}

setDate(todayIso());
if(licGate()){if(!DB.cfg.ok)showWelcome()}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
// volta para "hoje" se o app ficou aberto de um dia para o outro
let lastToday=todayIso();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(!licGate())return;const t=todayIso();
  if(t!==lastToday){if(curDate===lastToday&&!cart.length)setDate(t);lastToday=t}});
</script>
</body>
